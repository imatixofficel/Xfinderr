name: Xfinder Auto Update

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xfinder-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl unzip ca-certificates
          mkdir -p bin
          curl -fL --retry 3 --connect-timeout 15 \
            -o /tmp/xray.zip \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -qo /tmp/xray.zip -d bin
          chmod +x bin/xray
          ./bin/xray version
          curl --version | head -1

      - name: Syntax check
        run: python -m compileall -q src

      - name: Collect -> scan -> transport check -> Xray check -> remix -> Xray recheck -> publish
        run: python -m src.main

      - name: Commit data only
        run: |
          git config user.name "Xfinder Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/configs.json data/raw_configs.json data/validated.json data/remixed.json data/scanned_clean_ips.json output/ sources.db
          git reset -- data/warp_accounts.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Xfinder: update $(date -u +%FT%TZ)"
            git push
          fi
